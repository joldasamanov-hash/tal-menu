<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>TAL — Залы ресторана</title>

<style>
  /* Те же цвета, что в меню */
  :root{
    --bg:#faf7f0; --fg:#1c1a16; --muted:#6c6558; --gold:#8a6a2c; --line:#e6dfd0; --photo:#efe8d8;
    --card:#fffdf8; --chip:#f1ebde; --brown:#4a3b2c; --brown-fg:#f2d79c;
    --serif:'Cormorant Garamond',Georgia,'Songti SC','Noto Serif SC',serif;
    --sans:'Golos',system-ui,'PingFang SC','Noto Sans SC',sans-serif;
    --orn:url(../img/ornline2.png);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#12110f;--fg:#ece5d6;--muted:#9a9384;--gold:#c8a66a;--line:#2b2820;--photo:#1b1915;
      --card:#1a1815;--chip:#24211c;--orn:url(../img/ornline2-dark.png);color-scheme:dark}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  main{max-width:1100px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}

  /* Верхняя строка: назад + язык */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 15px 9px 12px;border-radius:999px;font-weight:500;font-size:14px;text-decoration:none;cursor:pointer}
  .back svg{width:18px;height:18px}
  .lang{display:flex;gap:2px}
  .lang button{border:0;background:none;padding:8px 7px;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .lang button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}

  /* Карточки этажей */
  .floor-list{display:grid;gap:18px}
  @media(min-width:860px){.floor-list{grid-template-columns:1fr 1fr}}
  .fcard{position:relative;display:block;width:100%;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:16/10;cursor:pointer;background:var(--photo);text-align:left}
  .fcard img{width:100%;height:100%;object-fit:cover}
  .fcard::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,16,12,.66) 0%,rgba(20,16,12,.2) 60%,rgba(20,16,12,0) 100%)}
  .fcard-t{position:absolute;left:22px;right:72px;top:50%;transform:translateY(-50%);z-index:1;color:#fff}
  .fcard-t h2{font-family:var(--serif);font-weight:500;font-size:clamp(44px,12vw,64px);line-height:1}
  .fcard-t p{margin-top:10px;font-size:14px;opacity:.92}
  .fcard-go{position:absolute;right:16px;bottom:16px;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--brown);color:var(--brown-fg);display:flex;align-items:center;justify-content:center}
  .fcard-go svg{width:20px;height:20px}
  .fcard:active{transform:scale(.985)}

  /* Этаж */
  .floor[hidden],.floor-list[hidden]{display:none}
  .cover{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;background:var(--photo)}
  @media(min-width:860px){.cover{aspect-ratio:21/9}}
  .cover img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,0) 50%,rgba(20,16,12,.6) 100%);pointer-events:none}
  .cover h2{position:absolute;left:22px;bottom:16px;z-index:1;color:#fff;font-family:var(--serif);font-weight:500;font-size:46px;line-height:1;pointer-events:none}

  .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
  .chip{border:1px solid var(--line);color:var(--fg);padding:8px 14px;border-radius:999px;font-size:14px;text-decoration:none;display:inline-flex;gap:7px;align-items:center}
  .chip b{font-weight:500;color:var(--gold)}

  .sec{position:relative;padding-top:52px;scroll-margin-top:12px}
  .sec::before{content:"";position:absolute;top:22px;left:0;right:0;height:16px;background:var(--orn) center/18px 16px;background-repeat:round no-repeat;opacity:.4}
  .sec h3{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;text-align:center;margin-bottom:18px}

  .grid{display:grid;gap:22px}
  @media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}

  .hall{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .gallery{position:relative;aspect-ratio:4/3;background:var(--photo)}
  .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .track::-webkit-scrollbar{display:none}
  .track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;cursor:zoom-in}
  .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:width .25s ease,background .25s ease}
  .dots i.on{background:#fff;width:18px;border-radius:4px}

  .body{padding:20px 20px 22px}
  .body h4{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.1}
  .meta{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 12px;font-size:15px;font-weight:500}
  .meta span{display:inline-flex;align-items:center;gap:7px}
  .meta svg{width:18px;height:18px;color:var(--gold)}
  .desc{color:var(--muted);font-size:15px;max-width:60ch}
  .events{margin-top:16px}
  .events p{font-size:14px;font-weight:500;color:var(--gold);margin-bottom:8px}
  .events div{display:flex;flex-wrap:wrap;gap:7px}
  .events b{font-weight:500;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--brown);color:var(--brown-fg)}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .tags span{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .book{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;padding:14px 18px;border-radius:14px;background:var(--brown);color:var(--brown-fg);font-weight:500;font-size:16px;text-decoration:none}
  .book svg{width:20px;height:20px}
  .book:active{transform:scale(.98)}
  .phone{display:block;text-align:center;margin-top:36px;color:var(--muted);font-size:14px}
  .phone a{color:var(--fg);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}

  /* Просмотр фото */
  .lb{position:fixed;inset:0;background:rgba(12,10,8,.94);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .lb.open{display:flex}
  .lb img{max-height:90vh;border-radius:10px}
  .lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

          kz:"Ақ дастарқаны мен жұмсақ орындықтары бар кең үстелдер — отбасылық кешкі асқа немесе достармен кездесуге.",
          en:"Spacious tables with white tablecloths and soft chairs — for a family dinner or a get-together with friends.",
          zh:"铺白桌布、配软椅的宽敞餐桌，适合家庭晚餐或朋友聚会。"},
    tags:{ru:["Белые скатерти","Мягкие стулья"],kz:["Ақ дастарқан","Жұмсақ орындықтар"],en:["White tablecloths","Soft chairs"],zh:["白色桌布","软椅"]} },

  { floor:2, type:"main", g:[8,10],
    photos:["img/f2-t8-1.jpg"],
    name:{ru:"Столы на 8–10 гостей",kz:"8–10 қонаққа арналған үстелдер",en:"Tables for 8–10",zh:"8–10人桌"},
    desc:{ru:"Длинный стол у мягких штор для большой компании, дня рождения или семейного застолья.",
          kz:"Үлкен компанияға, туған күнге немесе отбасылық дастарқанға арналған жұмсақ перде жанындағы ұзын үстел.",
          en:"A long table by the soft curtains for a large group, a birthday or a family feast.",
          zh:"窗帘旁的长桌，适合大型聚会、生日或家庭宴席。"},
    tags:{ru:["Один длинный стол","Для большой компании"],kz:["Бір ұзын үстел","Үлкен компанияға"],en:["One long table","For large groups"],zh:["一张长桌","适合大型聚会"]} },

  { floor:2, type:"main", g:[4,6],
    photos:["img/f2-corner-1.jpg","img/f2-corner-2.jpg"],
    name:{ru:"Угловые столы на 4–6 гостей",kz:"4–6 қонаққа арналған бұрыштағы үстелдер",en:"Corner tables for 4–6",zh:"4–6人角落桌"},
    desc:{ru:"Столы необычной округлой формы в уютных углах зала — у штор, зелени и декоративной кирпичной стены.",
          kz:"Залдың жайлы бұрыштарындағы ерекше дөңгелек пішінді үстелдер — перделер, өсімдіктер және сәндік кірпіш қабырға жанында.",
          en:"Unusually rounded tables in cosy corners of the hall — by the curtains, the greenery and the decorative brick wall.",
          zh:"位于大厅温馨角落的独特弧形餐桌，靠近窗帘、绿植和装饰砖墙。"},
    tags:{ru:["Угловое расположение","Округлый стол","Рядом зелень"],kz:["Бұрышта","Дөңгелек үстел","Өсімдіктер жанында"],en:["Corner spot","Rounded table","Next to greenery"],zh:["角落位置","弧形餐桌","绿植旁"]} },

  { floor:2, type:"main", g:[4],
    photos:["img/f2-t4-1.jpg","img/f2-t4-2.jpg"],
    name:{ru:"Столы на 4 гостей",kz:"4 қонаққа арналған үстелдер",en:"Tables for 4",zh:"4人桌"},
    desc:{ru:"Уютные столы с белыми скатертями для небольшой компании — у штор и в центре зала.",
          kz:"Шағын компанияға арналған ақ дастарқаны бар жайлы үстелдер — перде жанында және залдың ортасында.",
          en:"Cosy tables with white tablecloths for a small group — by the curtains and in the middle of the hall.",
          zh:"铺白桌布的舒适餐桌，适合小型聚会，位于窗帘旁和大厅中央。"},
    tags:{ru:["Белые скатерти","Для небольшой компании"],kz:["Ақ дастарқан","Шағын компанияға"],en:["White tablecloths","For small groups"],zh:["白色桌布","适合小型聚会"]} }
];
/* =============================================== */

const UI = {
  ru:{title:"TAL — Залы ресторана",menu:"Меню",all:"Все этажи",floor:r=>`${r} этаж`,
      sec:{vip:"VIP-залы",main:"Общий зал",sofa:"Диванчики"},
      upto:n=>`до ${n} гостей`,range:(a,b)=>`${a}–${b} гостей`,
      tables:n=>`${n} ${n===1?"стол":n<5?"стола":"столов"}`,
      events:"Для праздников",book:"Забронировать",call:"Бронь по телефону",close:"Закрыть",
      msg:(n,f)=>`Здравствуйте! Хочу забронировать: ${n}, ${f}.`},
  kz:{title:"TAL — Мейрамхана залдары",menu:"Мәзір",all:"Барлық қабаттар",floor:r=>`${r} қабат`,
      sec:{vip:"VIP-залдар",main:"Жалпы зал",sofa:"Дивандар"},
      upto:n=>`${n} қонаққа дейін`,range:(a,b)=>`${a}–${b} қонақ`,
      tables:n=>`${n} үстел`,
      events:"Мерекелерге",book:"Брондау",call:"Телефон арқылы брондау",close:"Жабу",
      msg:(n,f)=>`Сәлеметсіз бе! Брондағым келеді: ${n}, ${f}.`},
  en:{title:"TAL — Restaurant halls",menu:"Menu",all:"All floors",floor:r=>`Floor ${r}`,
      sec:{vip:"VIP rooms",main:"Main hall",sofa:"Sofa seating"},
      upto:n=>`up to ${n} guests`,range:(a,b)=>`${a}–${b} guests`,
      tables:n=>`${n} ${n===1?"table":"tables"}`,
      events:"For celebrations",book:"Book",call:"Book by phone",close:"Close",
      msg:(n,f)=>`Hello! I'd like to book: ${n}, ${f}.`},
  zh:{title:"TAL — 餐厅区域",menu:"菜单",all:"所有楼层",floor:r=>({I:"一楼",II:"二楼"})[r],
      sec:{vip:"VIP包间",main:"大厅",sofa:"沙发座"},
      upto:n=>`最多${n}位`,range:(a,b)=>`${a}–${b}位`,
      tables:n=>`${n}张桌`,
      events:"适合庆典",book:"预订",call:"电话预订",close:"关闭",
      msg:(n,f)=>`您好！我想预订：${n}，${f}。`}
};
const SECTIONS = ["vip","main","sofa"];
const ROMAN = {1:"I",2:"II"};

/* язык — тот же, что выбран в меню */
let lang = "ru";
try{ const s=localStorage.getItem("tal-lang"); if(["kz","ru","en","zh"].includes(s)) lang=s;
  else{ const n=(navigator.language||"").toLowerCase(); if(n.startsWith("kk"))lang="kz"; else if(n.startsWith("zh"))lang="zh"; else if(n.startsWith("en"))lang="en"; } }catch(e){}

const icons = {
  guests:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.6 0 4.4 1.4 5 4"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9h18M6 9v10M18 9v10M5 5h14"/></svg>',
  door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4h7v16M13 4h7v16h-7"/><path d="M9 12h.01M15 12h.01" stroke-linecap="round" stroke-width="2.2"/><path d="M2 20h20"/></svg>',
  go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const secsOf = f => SECTIONS.filter(t => HALLS.some(h => h.floor===f && h.type===t));

function guests(h){ const T=UI[lang]; return h.g.length>1 ? T.range(h.g[0],h.g[1]) : T.upto(h.g[0]); }
function listJoin(items){ return items.map((x,i)=> i && lang!=="zh" && !/^VIP/.test(x) ? x[0].toLowerCase()+x.slice(1) : x).join(lang==="zh"?"、":", "); }

function card(h){
  const T=UI[lang], name=h.name[lang], fl=T.floor(ROMAN[h.floor]);
  const wa=`https://wa.me/${WA}?text=${encodeURIComponent(T.msg(name,fl))}`;
  return `<article class="hall">
    <div class="gallery">
      <div class="track">${h.photos.map(p=>`<img src="${p}" alt="${esc(name)}" loading="lazy">`).join("")}</div>
      ${h.photos.length>1 ? `<div class="dots" aria-hidden="true">${h.photos.map((_,j)=>`<i class="${j?"":"on"}"></i>`).join("")}</div>` : ""}
    </div>
    <div class="body">
      <h4>${esc(name)}</h4>
      <div class="meta"><span>${icons.guests}${guests(h)}</span>${h.tables?`<span>${icons.table}${T.tables(h.tables)}</span>`:""}${h.feature?`<span>${icons.door}${esc(h.feature[lang])}</span>`:""}</div>
      <p class="desc">${esc(h.desc[lang])}</p>
      ${h.events ? `<div class="events"><p>${T.events}</p><div>${h.events.map(e=>`<b>${esc(e)}</b>`).join("")}</div></div>` : ""}
      <div class="tags">${h.tags[lang].map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <a class="book" href="${wa}" target="_blank" rel="noopener">${icons.wa}${T.book}</a>
    </div>
  </article>`;
}

function render(){
  const T=UI[lang];
  document.documentElement.lang={kz:"kk",ru:"ru",en:"en",zh:"zh"}[lang];
  document.title=T.title;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.querySelector("#lb button").setAttribute("aria-label",T.close);
  document.getElementById("phone").innerHTML=`${T.call}: <a href="tel:${PHONE.replace(/\s/g,"")}">${PHONE}</a>`;

  document.getElementById("floors").innerHTML =
    `<div class="floor-list" id="floor-list">${[1,2].map(f=>`
      <button class="fcard" data-open="${f}">
        <img src="${FLOOR_COVERS[f]}" alt="">
        <div class="fcard-t"><h2>${T.floor(ROMAN[f])}</h2><p>${listJoin(secsOf(f).map(t=>T.sec[t]))}</p></div>
        <span class="fcard-go">${icons.go}</span>
      </button>`).join("")}</div>` +
    [1,2].map(f=>{
      const inF=HALLS.filter(h=>h.floor===f);
      return `<div class="floor" data-floor="${f}" hidden>
        <div class="cover"><img src="${FLOOR_COVERS[f]}" alt="${esc(T.floor(ROMAN[f]))}"><h2>${T.floor(ROMAN[f])}</h2></div>
        <nav class="chips">${secsOf(f).map(t=>`<a class="chip" href="#f${f}-${t}">${T.sec[t]} <b>${inF.filter(h=>h.type===t).length}</b></a>`).join("")}</nav>
        ${secsOf(f).map(t=>`<section class="sec" id="f${f}-${t}"><h3>${T.sec[t]}</h3>
          <div class="grid">${inF.filter(h=>h.type===t).map(card).join("")}</div></section>`).join("")}
      </div>`;
    }).join("");

  document.querySelectorAll(".gallery").forEach(g=>{
    const t=g.querySelector(".track"), d=g.querySelectorAll(".dots i");
    if(!d.length) return;
    t.addEventListener("scroll",()=>{const k=Math.round(t.scrollLeft/t.clientWidth);d.forEach((x,j)=>x.classList.toggle("on",j===k))},{passive:true});
  });
  route();
}

/* #floor-1 / #floor-2; пусто = выбор этажа */
function route(){
  const m=location.hash.match(/^#floor-(\d)$/), f=m?m[1]:null, T=UI[lang], back=document.getElementById("back");
  document.getElementById("floor-list").hidden=!!f;
  document.querySelectorAll(".floor").forEach(x=>x.hidden = x.dataset.floor!==f);
  document.getElementById("back-t").textContent = f ? T.all : T.menu;
  back.setAttribute("href", f ? "#" : "../");
  back.dataset.mode = f ? "floors" : "menu";
}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");
  if(o){ location.hash="floor-"+o.dataset.open; window.scrollTo(0,0); return; }
  const b=e.target.closest("#back");
  if(b && b.dataset.mode==="floors"){ e.preventDefault(); history.replaceState(null,"",location.pathname+location.search); route(); window.scrollTo(0,0); return; }
  const c=e.target.closest(".chip");
  if(c){ e.preventDefault(); document.querySelector(c.getAttribute("href")).scrollIntoView({behavior:"smooth"}); return; }
  const l=e.target.closest(".lang button");
  if(l){ lang=l.dataset.l; try{localStorage.setItem("tal-lang",lang)}catch(_){ } render(); return; }
  if(e.target.matches(".track img, .cover img")){ lbi.src=e.target.src; lb.classList.add("open"); return; }
  if(e.target===lb || e.target.closest(".lb button")) lb.classList.remove("open");
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") lb.classList.remove("open"); });
const lb=document.getElementById("lb"), lbi=lb.querySelector("img");
render();
</script>
</body>
</html>
