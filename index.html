/* Layout: dark, quiet single column; large full-width dish photos, serif section titles, gold hairlines, text-only language links. */
:root{--bg:#12110f;--fg:#ece5d6;--muted:#9a9384;--gold:#c8a66a;--line:#2b2820;--photo:#1b1915;--serif:'Cormorant Garamond','Cormorant',Georgia,'Songti SC','Noto Serif SC',serif;--sans:BZ,'Inter',system-ui,'PingFang SC','Noto Sans SC',sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf7f0;--fg:#1c1a16;--muted:#7a7366;--gold:#8a6a2c;--line:#e6dfd0;--photo:#efe8d8;color-scheme:light}}
:root[data-theme="light"]{--bg:#faf7f0;--fg:#1c1a16;--muted:#7a7366;--gold:#8a6a2c;--line:#e6dfd0;--photo:#efe8d8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;letter-spacing:.01em;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:560px;margin:0 auto}
header{padding:56px 0 20px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.logo{width:120px}
.logo svg{width:100%;height:auto;display:block}
.logo svg path{fill:var(--fg)!important}
.tag{color:var(--muted);font-family:var(--sans);font-size:17px;line-height:1.55;letter-spacing:.01em;max-width:24em;text-wrap:balance}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;margin-top:18px;border-bottom:1px solid var(--line)}
.lang{display:flex;gap:24px;justify-content:center;margin-bottom:10px}
.lang button{font:inherit;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:9px 0 6px;cursor:pointer;border-bottom:1px solid transparent}
.lang button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.chips{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--muted);font-weight:800;font-size:15px;letter-spacing:.04em;white-space:nowrap;padding:8px 0 6px;border-bottom:1px solid transparent}
.chips a[aria-current="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.chips a:hover{color:var(--fg)}
.chips a:focus-visible,.lang button:focus-visible,.it .ph:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
section{padding-top:72px;scroll-margin-top:60px}
h2{margin:0;color:var(--fg);font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:.01em;text-wrap:balance;text-align:center}
.rule{display:block;width:36px;height:1px;background:var(--gold);margin:18px auto 22px}
.note{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:16px;text-align:center;margin:-6px 0 24px}
.it{padding:26px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ph{display:block;width:100%;border:0;padding:0;margin:0 0 16px;background:var(--photo);cursor:zoom-in;border-radius:14px;overflow:hidden}
.ph img{width:100%;height:auto;display:block}
.row{display:flex;gap:20px;align-items:baseline;justify-content:space-between}
.tx{min-width:0;flex:1}
.nm{font-size:16px;letter-spacing:.02em;overflow-wrap:anywhere}
.ds{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55;max-width:34em}
.pr{flex:none;font-variant-numeric:tabular-nums;color:var(--gold);font-size:14px;letter-spacing:.04em;white-space:nowrap}
footer{margin-top:72px;padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;display:flex;flex-direction:column;gap:8px}
footer a{color:var(--gold);text-decoration:none}
#lb{position:fixed;inset:0;z-index:20;background:rgba(8,7,6,.94);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:min(100%,900px);max-height:100%;border-radius:14px}
@media (prefers-reduced-motion:no-preference){.chips{scroll-behavior:smooth}.lang button,.chips a{transition:color .2s}}
.bar{padding-bottom:0;border-bottom:0}
.chips{background:#4a3b2c;margin:0 -6px;padding:6px 16px;border-radius:12px;box-shadow:0 8px 18px -6px rgba(40,28,16,.45)}
.bar{background:transparent}
.chips a,.chips a:hover{color:#eadfca}
.chips a[aria-current="true"]{color:#f2d79c;border-bottom-color:#f2d79c}
body{position:relative}
body::after{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;background:url(img/orn5-dark.png) repeat;background-size:400px 600px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body::after{background-image:url(img/orn5.png)}}
:root[data-theme="light"] body::after{background-image:url(img/orn5.png)}
.it .row{padding:0 8px}
section+section{position:relative;margin-top:28px}
section+section::before{content:"";position:absolute;top:16px;left:-6px;right:-6px;height:22px;background:url(img/ornline2.png) center/24px 22px;background-repeat:round no-repeat}
.hero{position:relative;width:100vw;margin-left:calc(50% - 50vw);overflow:hidden}
.hero img{width:100%;height:auto;aspect-ratio:1672/941;display:block}
header .logo{display:none}
header{padding-top:20px}
.hero.noorn{z-index:11;margin-bottom:32px}
body{letter-spacing:-.015em}
.tag{letter-spacing:-.015em}
.nm{letter-spacing:-.01em}
.ds{letter-spacing:-.005em}
.pr{letter-spacing:0}
.chips a{letter-spacing:0}
.lang button{letter-spacing:.08em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section+section::before{background-image:url(img/ornline2-dark.png)}}

let io;
function spy(){
  if(io)io.disconnect();
  if(!('IntersectionObserver' in window))return;
  const links=[...document.querySelectorAll('#chips a')],nav=document.getElementById('chips');
  io=new IntersectionObserver(es=>{es.forEach(en=>{if(!en.isIntersecting)return;
    const i=+en.target.id.slice(1);
    links.forEach((a,k)=>a.setAttribute('aria-current',k===i));
    const a=links[i];if(a)nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2,behavior:'smooth'});
  })},{rootMargin:'-130px 0px -70% 0px'});
  document.querySelectorAll('main section').forEach(s=>io.observe(s));
}
['kz','ru','en','zh'].forEach(l=>{document.getElementById('b-'+l).onclick=()=>{lang=l;try{localStorage.setItem('tal-lang',lang)}catch(e){}render()}});

lb.onclick=()=>{lb.hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
render();

(function(){
  const b=document.querySelector('.bar'),c=document.getElementById('chips');if(!b||!c)return;
  function fit(){const off=Math.max(0,Math.round(c.getBoundingClientRect().top-b.getBoundingClientRect().top)-6);b.style.top='calc(env(safe-area-inset-top,0px) - '+off+'px)'}
  fit();addEventListener('resize',fit);
})();

(function(){const c=document.getElementById('chips');if(!c)return;
const b=c.closest('.bar');function f(){b.classList.toggle('end',c.scrollLeft+c.clientWidth>=c.scrollWidth-4);b.style.setProperty('--ch',c.offsetHeight+'px')}
c.addEventListener('scroll',f,{passive:true});addEventListener('resize',f);setTimeout(f,50);})();

(function(){try{if('scrollRestoration' in history)history.scrollRestoration='manual'}catch(e){}
function top(){if(!location.hash)window.scrollTo(0,0)}
top();addEventListener('load',top);addEventListener('pageshow',top);})();

(function(){const t=document.createElement('div');t.className='topcover';t.setAttribute('aria-hidden','true');document.body.appendChild(t);
const c=document.getElementById('chips');
function f(){t.classList.toggle('on',c&&c.getBoundingClientRect().top<=parseFloat(getComputedStyle(t).height)+2)}
addEventListener('scroll',f,{passive:true});addEventListener('resize',f);f();})();

(function(){const b=document.querySelector('.totop');if(!b)return;
function f(){b.classList.toggle('show',scrollY>innerHeight*1.2)}
addEventListener('scroll',f,{passive:true});f();
b.addEventListener('click',()=>{const r=matchMedia('(prefers-reduced-motion: reduce)').matches;window.scrollTo({top:0,behavior:r?'auto':'smooth'})});})();
